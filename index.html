<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Partita for Solo Clarinet IV</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #1a1a24;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Cormorant Garamond", Georgia, serif;
      }

      .card {
        width: 480px;
        height: 600px;
        background: linear-gradient(
          160deg,
          #f7f4ec 0%,
          #efe9db 55%,
          #e7dfcd 100%
        );
        border-radius: 18px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
      }

      /* faixa superior com a foto */
      .photo-wrap {
        height: 235px;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
      }
      .photo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        filter: sepia(0.28) saturate(0.3) contrast(1.02);
      }
      .photo-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(26, 26, 36, 0) 55%,
          #f7f4ec 100%
        );
      }
      .numeral {
        position: absolute;
        top: 14px;
        right: 20px;
        font-size: 58px;
        font-weight: 600;
        color: rgba(247, 244, 236, 0.92);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
        line-height: 1;
      }
      .numeral small {
        display: block;
        font-family: "Montserrat", sans-serif;
        font-size: 9px;
        color: #1a1a24;
        letter-spacing: 4px;
        font-weight: 600;
        text-transform: uppercase;
        opacity: 0.85;
        margin-top: 4px;
      }

      .content {
        flex: 1;
        padding: 6px 40px 30px;
        text-align: center;
        display: flex;
        flex-direction: column;
      }

      .rule {
        width: 54px;
        height: 2px;
        background: #c98ad7;
        margin: 6px auto 16px;
        border-radius: 2px;
      }

      h1 {
        font-size: 33px;
        font-weight: 600;
        color: #26232e;
        line-height: 1.14;
        letter-spacing: 0.5px;
      }
      h1 .solo {
        display: block;
      }

      h2 {
        font-family: "Montserrat", sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: #c98ad7;
        margin-top: 10px;
      }

      .program-note {
        margin-top: 22px;
        font-size: 18.5px;
        font-style: italic;
        color: #4c4757;
        line-height: 1.5;
      }
      .program-note strong {
        color: #26232e;
        font-style: normal;
      }

      .author {
        margin-top: auto;
        padding-top: 18px;
        border-top: 1px solid rgba(38, 35, 46, 0.15);
      }
      .author .label {
        font-family: "Montserrat", sans-serif;
        font-size: 9px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #8a8496;
      }
      .author .name {
        font-size: 21px;
        font-weight: 600;
        color: #26232e;
        margin-top: 4px;
        letter-spacing: 1px;
      }

      .corner {
        position: absolute;
        width: 90px;
        height: 90px;
        pointer-events: none;
      }
      .corner.tl {
        top: 12px;
        left: 12px;
        border-top: 2px solid #6d4aff;
        border-left: 2px solid #6d4aff;
        border-radius: 6px 0 0 0;
      }
      .corner.br {
        bottom: 12px;
        right: 12px;
        border-bottom: 2px solid #6d4aff;
        border-right: 2px solid #6d4aff;
        border-radius: 0 0 6px 0;
      }

      .hint {
        color: #7a7686;
        font-family: "Montserrat", sans-serif;
        font-size: 11px;
        text-align: center;
        margin-top: 14px;
        letter-spacing: 0.3px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="card">
        <div class="corner tl"></div>
        <div class="corner br"></div>

        <div class="photo-wrap">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/d/dd/Guillaume_Almanach.jpg"
            alt="Clarinete"
          />
          <div class="numeral">IV</div>
        </div>

        <div class="content">
          <div class="rule"></div>
          <h1><span class="solo">Partita</span> for Solo Clarinet</h1>
          <h2>in A♭ Major</h2>

          <p class="program-note">
            “Nunca antes fora escrita uma partita para
            <strong>clarinete</strong> na história. Agora, são
            <strong>quatro</strong>!”
          </p>

          <div class="author">
            <div class="label">Composição</div>
            <div class="name">Caio Simões</div>
          </div>
        </div>
      </div>

      <p class="hint">
        Tirar um print deste card (ou salvar como imagem) para compartilhar no
        WhatsApp.
      </p>
    </div>
  </body>
  <script type="module">
    import puppeteer from "https://cdn.jsdelivr.net/npm/puppeteer@25.18.1/+esm";

    (async () => {
      const browser = await puppeteer.launch()
      const page = await browser.newPage()
      await page.setViewport({ width: 520, height: 700, deviceScaleFactor: 3 })
      await page.goto("file://" + __dirname + "/card.html")
      await page.waitForNetworkIdle()
      const el = await page.$(".card")
      await el.screenshot({ path: "partita-card.png" })
      await browser.close()
      console.log("PNG salvo!")
    })()
  </script>
</html>
